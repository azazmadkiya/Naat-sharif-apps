name: Build Android APK and AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Debug Keystore if missing
        run: |
          if [ ! -f ./debug.keystore ]; then
            if [ -f ./debug.keystore.base64 ]; then
              base64 -d ./debug.keystore.base64 > ./debug.keystore
            else
              keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK, Release APK and AAB
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Organize Output Artifacts
        run: |
          mkdir -p build-outputs
          cp -f app/build/outputs/apk/debug/*.apk build-outputs/ 2>/dev/null || true
          cp -f app/build/outputs/apk/release/*.apk build-outputs/ 2>/dev/null || true
          cp -f app/build/outputs/bundle/release/*.aab build-outputs/ 2>/dev/null || true
          echo "Output files in build-outputs:"
          ls -lh build-outputs/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs
          path: build-outputs/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          gh release create "$TAG_NAME" build-outputs/* \
            --title "Build Release $TAG_NAME (#${{ github.run_number }})" \
            --notes "Automated Android APK and AAB build generated by GitHub Actions." \
            --latest || echo "Release already exists or token notice"
